<div class="px-1 lg:px-4 space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500 pb-12">
  <!-- Header Area -->
  <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 bg-white p-6 rounded-2xl border border-gray-150 shadow-xs">
    <div class="flex items-start md:items-center gap-4">
      <a 
        routerLink="/admin/manage-careers"
        class="p-2.5 bg-gray-50 border border-gray-150 hover:bg-gray-100 text-gray-700 rounded-xl transition-all cursor-pointer inline-flex items-center justify-center shrink-0 mt-1 md:mt-0"
        title="Regresar a Carreras"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
      </a>
      <div class="space-y-1.5">
        <div class="flex flex-wrap items-center gap-2">
          <h2 class="text-lg font-extrabold text-oxford-navy-950 tracking-tight leading-none">
            {{ studyPlan()?.name || 'Cargando Plan...' }}
          </h2>
          <span 
            *ngIf="studyPlan()?.isLatest" 
            class="px-1.5 py-0.5 text-[9px] bg-green-50 text-green-700 border border-green-200 rounded font-black uppercase tracking-wider leading-none"
          >
            Oficial
          </span>
        </div>
        
        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-gray-550 font-semibold">
          <div class="flex items-center gap-1">
            <span class="text-gray-400 font-bold uppercase text-[9px]">Carrera:</span>
            <span class="text-oxford-navy-900 font-extrabold">{{ career()?.name || 'Cargando...' }}</span>
          </div>
          <span class="text-gray-250" *ngIf="career()?.semesters">•</span>
          <div class="flex items-center gap-1" *ngIf="career()?.semesters">
            <span class="text-gray-400 font-bold uppercase text-[9px]">Semestres:</span>
            <span class="text-gray-700 font-extrabold">{{ career()?.semesters }}</span>
          </div>
          <span class="text-gray-250" *ngIf="studyPlan()?.createdAt">•</span>
          <div class="flex items-center gap-1" *ngIf="studyPlan()?.createdAt">
            <span class="text-gray-400 font-bold uppercase text-[9px]">Fecha Registro:</span>
            <span class="text-gray-700 font-extrabold">{{ studyPlan()?.createdAt | date:'dd/MM/yyyy' }}</span>
          </div>
        </div>

        <!-- Scraping URL link -->
        <div *ngIf="studyPlan()?.url" class="flex items-center gap-1.5 text-[10px]">
          <span class="text-gray-400 font-bold uppercase text-[8px]">Origen UASLP:</span>
          <a 
            [href]="studyPlan()?.url" 
            target="_blank" 
            class="text-cerulean-600 hover:text-cerulean-700 font-extrabold flex items-center gap-1 transition-colors hover:underline"
          >
            <span>Ver fuente de datos original</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
            </svg>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Malla Visualizer Component -->
  <app-study-plan-malla
    [studyPlan]="studyPlan()"
    [career]="career()"
    [isLoading]="isLoading()"
  ></app-study-plan-malla>
</div>
