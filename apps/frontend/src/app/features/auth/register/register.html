<div class="text-center mb-8">
  <h2 class="text-2xl font-extrabold text-oxford-navy-900 tracking-tight mb-2">
    Crea tu cuenta
  </h2>
  <p class="text-oxford-navy-500 text-sm">
    Únete a Eduno y transforma tu aprendizaje
  </p>
</div>

@if (errorMessage()) {
  <div class="mb-6 p-4 bg-punch-red-50 border border-punch-red-100 rounded-xl flex items-center gap-3 animate-in fade-in slide-in-from-top-2">
    <svg class="w-5 h-5 text-punch-red-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <p class="text-sm font-medium text-punch-red-800">{{ errorMessage() }}</p>
  </div>
}

<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
  <!-- Nombre -->
  <app-form-field
    id="name"
    formControlName="name"
    label="Nombre completo"
    icon="user"
    type="text"
    placeholder="Juan Pérez"
    autocomplete="name"
    [error]="f['name'].touched && f['name'].errors?.['required'] ? 'El nombre es obligatorio' : 
            f['name'].touched && f['name'].errors?.['minlength'] ? 'Mínimo 3 caracteres' : ''"
  />

  <!-- Email -->
  <app-form-field
    id="email"
    formControlName="email"
    label="Correo electrónico"
    icon="email"
    type="email"
    placeholder="a234567@alumnos.uaslp.mx"
    autocomplete="email"
    [error]="f['email'].touched && f['email'].errors?.['required'] ? 'El correo es obligatorio' : 
            f['email'].touched && f['email'].errors?.['email'] ? 'Formato de correo inválido' : ''"
  />

  <!-- Contraseñas -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <app-form-field
      id="password"
      formControlName="password"
      label="Contraseña"
      icon="password"
      type="password"
      placeholder="••••••••"
      autocomplete="new-password"
      [error]="f['password'].touched && f['password'].errors?.['required'] ? 'La contraseña es obligatoria' : 
              f['password'].touched && f['password'].errors?.['minlength'] ? 'Mínimo 8 caracteres' : ''"
    />

    <app-form-field
      id="confirm_password"
      formControlName="confirmPassword"
      label="Confirmar"
      icon="password"
      type="password"
      placeholder="••••••••"
      autocomplete="new-password"
      [error]="f['confirmPassword'].touched && registerForm.errors?.['mismatch'] ? 'Las contraseñas no coinciden' : ''"
    />
  </div>

  <!-- Submit -->
  <div class="pt-2">
    <app-button
      variant="primary"
      size="lg"
      type="submit"
      class="w-full"
      [loading]="isLoading()"
      [disabled]="isLoading()"
    >
      Crear cuenta
    </app-button>
  </div>
</form>

<!-- Login Prompt -->
<div class="mt-6 text-center text-sm">
  <span class="text-oxford-navy-600">¿Ya tienes cuenta?</span>
  <a routerLink="/auth/login" class="ml-1 font-bold text-punch-red-500 hover:text-punch-red-600 transition-colors">
    Inicia sesión
  </a>
</div>
