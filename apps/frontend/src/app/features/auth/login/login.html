<div class="text-center mb-8">
  <h2 class="text-2xl font-extrabold text-oxford-navy-900 tracking-tight mb-2">
    Inicia sesión en Eduno
  </h2>
  <p class="text-oxford-navy-500 text-sm">
    Tu puerta de entrada al éxito universitario
  </p>
</div>

<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-6">
  <!-- Email -->
  <app-form-field
    id="email"
    formControlName="email"
    label="Correo institucional o personal"
    icon="email"
    type="email"
    placeholder="a234567@alumnos.uaslp.mx"
    autocomplete="username"
    [error]="f['email'].touched && f['email'].errors?.['required'] ? 'El correo es obligatorio' : 
            f['email'].touched && f['email'].errors?.['email'] ? 'Formato de correo inválido' : ''"
  />

  <!-- Password -->
  <div>
    <app-form-field
      id="password"
      formControlName="password"
      label="Contraseña"
      icon="password"
      type="password"
      placeholder="••••••••"
      autocomplete="current-password"
      [error]="f['password'].touched && f['password'].errors?.['required'] ? 'La contraseña es obligatoria' : ''"
    />
    <div class="flex justify-end mt-2">
      <a href="#" class="text-sm font-medium text-punch-red-500 hover:text-punch-red-600 transition-colors">
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </div>

  <!-- Submit -->
  <div>
    @if (errorMessage()) {
      <div class="mb-4 text-sm font-medium text-punch-red-600 bg-punch-red-50 p-3 rounded-lg border border-punch-red-100 flex items-center">
        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }
    <app-button variant="primary" size="lg" type="submit" class="w-full" [disabled]="isLoading()">
      {{ isLoading() ? 'Verificando...' : 'Iniciar sesión' }}
      <ng-container icon-right>
        <svg class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </ng-container>
    </app-button>
  </div>

  <!-- Divider -->
  <div class="relative my-6">
    <div class="absolute inset-0 flex items-center">
      <div class="w-full border-t border-cerulean-100"></div>
    </div>
    <div class="relative flex justify-center text-sm">
      <span class="px-2 bg-white text-oxford-navy-400 font-medium">O continúa con</span>
    </div>
  </div>

  <!-- Social Logins -->
  <div class="grid grid-cols-2 gap-4">
    <button
      type="button"
      (click)="loginWithSocial('google')"
      class="flex w-full items-center justify-center gap-3 rounded-xl bg-white px-3 py-2 text-sm font-bold text-oxford-navy-700 shadow-sm ring-1 ring-inset ring-cerulean-100 hover:bg-cerulean-50 focus-visible:ring-transparent transition-all duration-200"
    >
      <svg class="h-5 w-5" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google
    </button>
    <button
      type="button"
      (click)="loginWithSocial('microsoft')"
      class="flex w-full items-center justify-center gap-3 rounded-xl bg-white px-3 py-2 text-sm font-bold text-oxford-navy-700 shadow-sm ring-1 ring-inset ring-cerulean-100 hover:bg-cerulean-50 focus-visible:ring-transparent transition-all duration-200"
    >
      <svg class="h-5 w-5" viewBox="0 0 23 23">
        <path fill="#f3f3f3" d="M0 0h23v23H0z"/>
        <path fill="#f35325" d="M1 1h10v10H1z"/>
        <path fill="#81bc06" d="M12 1h10v10H12z"/>
        <path fill="#05a6f0" d="M1 12h10v10H1z"/>
        <path fill="#ffba08" d="M12 12h10v10H12z"/>
      </svg>
      Microsoft
    </button>
  </div>
</form>

<!-- Sign Up Prompt -->
<div class="mt-8 text-center text-sm">
  <span class="text-oxford-navy-600">¿No tienes cuenta?</span>
  <a routerLink="/auth/register" class="ml-1 font-bold text-punch-red-500 hover:text-punch-red-600 transition-colors">
    Regístrate gratis
  </a>
</div>
