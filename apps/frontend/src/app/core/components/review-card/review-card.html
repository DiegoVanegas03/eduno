<div class="bg-white rounded-3xl p-6 shadow-sm border border-cerulean-100 relative">
  <div class="flex justify-between items-start mb-4">
    <div class="flex items-center gap-3">
      <div [ngClass]="['w-10 h-10 rounded-full flex items-center justify-center font-bold', themeClasses.avatarBg, themeClasses.avatarText]">
        {{ authorInitial }}
      </div>
      <div>
        <h4 class="font-bold text-oxford-navy-900 text-sm">{{ author }}</h4>
        <p class="text-xs text-oxford-navy-500">{{ timeAgo }}</p>
      </div>
    </div>
    <div class="flex gap-1 text-honeydew-600">
      @for (star of starsArray; track star) {
        <svg class="w-4 h-4 fill-current" [ngClass]="{'text-oxford-navy-200': star > rating}" viewBox="0 0 20 20">
          <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
        </svg>
      }
    </div>
  </div>
  <p class="text-oxford-navy-600 text-sm leading-relaxed">
    "{{ comment }}"
  </p>
  <div [ngClass]="['mt-4 inline-flex items-center gap-2 px-3 py-1 text-xs font-semibold rounded-lg', themeClasses.badgeBg, themeClasses.badgeText]">
    {{ subject }}
  </div>
</div>
