<div class="bg-white rounded-3xl p-6 shadow-sm border border-cerulean-100 relative group transition-all hover:shadow-md">
  <!-- Top header -->
  <div class="flex justify-between items-start mb-4">
    <div class="flex items-center gap-3">
      <!-- Avatar/Image -->
      @if (authorImage) {
        <img [src]="authorImage" alt="Avatar" class="w-10 h-10 rounded-full object-cover border border-cerulean-100 shadow-sm animate-fade-in" />
      } @else {
        <div [ngClass]="['w-10 h-10 rounded-full flex items-center justify-center font-bold shadow-sm', themeClasses.avatarBg, themeClasses.avatarText]">
          {{ authorInitial }}
        </div>
      }
      
      <div>
        <div class="flex flex-wrap items-center gap-2">
          <h4 class="font-bold text-oxford-navy-900 text-sm">{{ author }}</h4>
          @if (isOwnReview) {
            <span class="bg-cerulean-50 text-cerulean-700 text-[10px] font-bold px-2 py-0.5 rounded-full border border-cerulean-100">
              Tú
            </span>
          }
          @if (subject) {
            <span class="bg-amber-50 text-amber-700 text-[10px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded border border-amber-200">
              {{ subject }}
            </span>
          }
        </div>
        <div class="flex items-center gap-1.5">
          <p class="text-xs text-oxford-navy-500">{{ timeAgo }}</p>
          @if (isEdited) {
            <span class="text-[10px] text-oxford-navy-400 font-medium italic">(Editado)</span>
          }
        </div>
      </div>
    </div>
    
    <!-- Stars & Actions -->
    <div class="flex items-center gap-4">
      <div class="flex gap-1 text-honeydew-600">
        @for (star of starsArray; track star) {
          <svg class="w-4 h-4 fill-current" [ngClass]="{'text-oxford-navy-200': star > rating}" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"></path>
          </svg>
        }
      </div>
      
      <!-- Actions: Edit & Delete -->
      @if (isOwnReview) {
        <div class="flex items-center gap-1">
          <button 
            (click)="onEdit.emit()" 
            title="Editar opinión"
            class="text-oxford-navy-400 hover:text-cerulean-500 hover:bg-cerulean-50 p-1.5 rounded-xl transition-all cursor-pointer flex items-center justify-center border border-transparent hover:border-cerulean-100"
          >
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path>
            </svg>
          </button>
          
          <button 
            (click)="onDelete.emit()" 
            title="Eliminar opinión"
            class="text-oxford-navy-400 hover:text-punch-red-500 hover:bg-punch-red-50 p-1.5 rounded-xl transition-all cursor-pointer flex items-center justify-center border border-transparent hover:border-punch-red-100"
          >
            <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
            </svg>
          </button>
        </div>
      } @else {
        <button 
          (click)="onReport.emit()" 
          title="Reportar comentario"
          class="text-oxford-navy-400 hover:text-amber-600 hover:bg-amber-50 p-1.5 rounded-xl transition-all cursor-pointer flex items-center justify-center border border-transparent hover:border-amber-100"
        >
          <svg class="w-4.5 h-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
          </svg>
        </button>
      }
    </div>
  </div>
  
  <!-- Comment -->
  <p class="text-oxford-navy-600 text-sm leading-relaxed mb-4 whitespace-pre-wrap">
    "{{ comment }}"
  </p>
  
  <!-- Footer with Likes / Dislikes -->
  <div class="flex items-center gap-3 pt-3 border-t border-cerulean-50 select-none">
    <!-- Like button -->
    <button 
      (click)="onLike.emit()"
      [ngClass]="{
        'bg-green-50 text-green-700 border-green-200': hasLiked,
        'text-oxford-navy-400 hover:text-green-600 hover:bg-green-50/50 border-transparent': !hasLiked
      }"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full border transition-all cursor-pointer"
    >
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 20 20">
        <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 00-.8 2.4L6.8 10.333a2 2 0 00-.8 0z"></path>
      </svg>
      <span>{{ likesCount }}</span>
    </button>

    <!-- Dislike button -->
    <button 
      (click)="onDislike.emit()"
      [ngClass]="{
        'bg-punch-red-50 text-punch-red-700 border-punch-red-200': hasDisliked,
        'text-oxford-navy-400 hover:text-punch-red-600 hover:bg-punch-red-50/50 border-transparent': !hasDisliked
      }"
      class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-full border transition-all cursor-pointer"
    >
      <svg class="w-3.5 h-3.5 fill-current rotate-180" viewBox="0 0 20 20">
        <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 00-.8 2.4L6.8 10.333a2 2 0 00-.8 0z"></path>
      </svg>
      <span>{{ dislikesCount }}</span>
    </button>
  </div>
</div>
