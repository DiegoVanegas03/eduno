@if (label()) {
  <label [for]="id()" class="block text-sm font-bold text-oxford-navy-700 mb-1">
    {{ label() }}
  </label>
}

<div class="relative">
  <!-- Left icon -->
  @if (iconPath) {
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="iconPath" />
      </svg>
    </div>
  }

  <!-- Native input -->
  <input
    [id]="id()"
    [name]="name()"
    [type]="effectiveType"
    [value]="value()"
    [placeholder]="placeholder()"
    [autocomplete]="autocomplete()"
    [required]="required()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
    class="block w-full py-2.5 border rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
    [class.pl-10]="iconPath"
    [class.pl-3]="!iconPath"
    [class.pr-10]="type() === 'password'"
    [class.pr-3]="type() !== 'password'"
    [class.border-cerulean-200]="!error()"
    [class.border-punch-red-400]="error()"
    [class.focus:ring-punch-red-400]="!error()"
  />

  <!-- Password toggle button -->
  @if (type() === 'password') {
    <button
      type="button"
      (click)="togglePasswordVisibility()"
      class="absolute inset-y-0 right-0 pr-3 flex items-center text-oxford-navy-400 hover:text-oxford-navy-600 transition-colors"
      [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    >
      @if (showPassword()) {
        <!-- Eye-off icon -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      } @else {
        <!-- Eye icon -->
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
      }
    </button>
  }
</div>

<!-- Error message -->
@if (error()) {
  <p class="mt-1 text-xs font-medium text-punch-red-600">{{ error() }}</p>
}

<!-- Hint text -->
@if (hint() && !error()) {
  <p class="mt-1 text-xs text-oxford-navy-400">{{ hint() }}</p>
}
