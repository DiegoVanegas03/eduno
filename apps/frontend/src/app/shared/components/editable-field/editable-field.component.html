<div class="relative pt-2 group" (click)="activateEdit()">
  <div class="absolute left-4 top-0 bg-white px-2 text-xs font-bold uppercase tracking-wider transition-colors"
       [ngClass]="disabled() ? 'text-gray-300' : 'text-gray-400 group-focus-within:text-red-600'">
    {{ label() }}
  </div>
  
  <div class="flex items-center gap-2">
    <div class="flex-1 border rounded-xl p-4 text-base font-medium transition-all duration-300"
         [ngClass]="{
           'border-gray-100 bg-gray-50 text-gray-400': disabled(),
           'border-gray-200 bg-white text-gray-700': !disabled(),
           'group-hover:border-gray-300 group-focus-within:border-red-500': !disabled(),
           'cursor-text': !disabled() && !isEditable() && (type() === 'text' || type() === 'textarea')
         }">
      
      @if (isEditable()) {
        @switch (type()) {
          @case ('select') {
            <div class="relative flex items-center">
              <select 
                [(ngModel)]="value"
                class="w-full bg-transparent border-none outline-none focus:ring-0 appearance-none cursor-pointer pr-8"
              >
                @for (option of options(); track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
              <svg class="w-4 h-4 text-gray-600 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
            </div>
          }
          @case ('textarea') {
            <textarea 
              #inputElement
              [(ngModel)]="value"
              [placeholder]="placeholder()"
              rows="3"
              class="w-full bg-transparent border-none outline-none focus:ring-0 resize-none"
            ></textarea>
          }
          @default {
            <input 
              #inputElement
              [type]="type()" 
              [(ngModel)]="value"
              [placeholder]="placeholder()"
              class="w-full bg-transparent border-none outline-none focus:ring-0"
            >
          }
        }
      } @else {
        <div class="flex items-center justify-between min-h-6">
          <span class="block">{{ displayValue() }}</span>
          @if (type() === 'select' && !disabled()) {
            <svg class="w-4 h-4 text-gray-300 opacity-70" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
          }
        </div>
      }
      
    </div>
    
    <ng-content select="[action]" />
  </div>
  <ng-content />
</div>
