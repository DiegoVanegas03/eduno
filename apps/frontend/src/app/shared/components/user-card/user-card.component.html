<div class="relative inline-block text-left w-full h-full max-w-60">
  <!-- Trigger -->
  <div 
    class="flex items-center gap-3 cursor-pointer p-2 rounded-xl hover:bg-cerulean-50 transition-colors w-full justify-between sm:justify-start"
    (click)="toggleDropdown($event)"
  >
    <div class="flex items-center gap-3 min-w-0">
      <app-avatar [user]="authService.currentUser()" size="md" />
      <div class="flex flex-col text-left min-w-0">
        <span class="text-sm font-bold text-oxford-navy-900 leading-tight select-none truncate block">{{ authService.currentUser()?.name }}</span>
        <span class="text-xs text-oxford-navy-500 font-medium uppercase select-none truncate block">{{ authService.userRole() }}</span>
      </div>
    </div>
    <svg class="w-4 h-4 text-oxford-navy-400 ml-1 transition-transform" [class.rotate-180]="isDropdownOpen()" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </div>

  <!-- Dropdown Menu -->
  @if (isDropdownOpen()) {
    <div 
      class="absolute right-0 sm:right-auto sm:left-1/2 sm:-translate-x-1/2 mt-2 w-56 bg-white rounded-2xl shadow-xl border border-cerulean-100 py-2 z-50 overflow-hidden origin-top transform transition-all duration-200 scale-100 opacity-100"
      (click)="$event.stopPropagation()"
    >
      <!-- Common Menu Items -->
      <a routerLink="/auth/my-account/settings" (click)="isDropdownOpen.set(false)" class="flex items-center px-4 py-3 text-sm font-medium text-oxford-navy-700 hover:bg-cerulean-50 hover:text-cerulean-700 transition-colors">
        <svg class="w-5 h-5 mr-3 text-oxford-navy-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
        Mi Cuenta
      </a>
      
      <!-- Admin Menu Items -->
      @if (authService.hasRole(Roles.ADMIN)) {
        <a routerLink="/admin/dashboard" (click)="isDropdownOpen.set(false)" class="flex items-center px-4 py-3 text-sm font-medium text-oxford-navy-700 hover:bg-cerulean-50 hover:text-cerulean-700 transition-colors">
          <svg class="w-5 h-5 mr-3 text-oxford-navy-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Panel Administrativo
        </a>
      }

      <div class="h-px bg-cerulean-100 my-1 w-full relative"></div>

      <!-- Logout -->
      <button (click)="onLogout($event)" class="w-full flex items-center px-4 py-3 text-sm font-bold text-punch-red-600 hover:bg-punch-red-50 transition-colors text-left cursor-pointer">
        <svg class="w-5 h-5 mr-3 text-punch-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        Cerrar Sesión
      </button>
    </div>
  }
</div>
