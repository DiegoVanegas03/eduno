services:
  minio:
    image: minio/minio:latest
    container_name: app_minio
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Consola Web
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD="DQ*ak!wf&RI9Pk1Kb@4h"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - app_network

  # Script para crear el bucket inicial en MinIO
  createbuckets:
    image: minio/mc:latest
    container_name: minio_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 minioadmin 'DQ*ak!wf&RI9Pk1Kb@4h';
      mc mb local/documentos;
      mc anonymous set public local/documentos;
      exit 0;
      "
    networks:
      - app_network

  clamav:
    image: clamav/clamav:latest
    container_name: app_clamav
    platform: linux/amd64
    ports:
      - "3310:3310"
    networks:
      - app_network

volumes:

  minio_data:

networks:
  app_network:
    driver: bridge
