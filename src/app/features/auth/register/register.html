<div class="text-center mb-8">
  <h2 class="text-2xl font-extrabold text-oxford-navy-900 tracking-tight mb-2">
    Crea tu cuenta
  </h2>
  <p class="text-oxford-navy-500 text-sm">
    Únete a Eduno y transforma tu aprendizaje
  </p>
</div>

<form class="space-y-4">
  <!-- Name Input -->
  <div>
    <label for="name" class="block text-sm font-bold text-oxford-navy-700 mb-1">
      Nombre completo
    </label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
      <input
        id="name"
        type="text"
        required
        class="block w-full pl-10 pr-3 py-2 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
        placeholder="Juan Pérez"
      />
    </div>
  </div>

  <!-- Email Input -->
  <div>
    <label for="email" class="block text-sm font-bold text-oxford-navy-700 mb-1">
      Correo electrónico
    </label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
        </svg>
      </div>
      <input
        id="email"
        type="email"
        required
        class="block w-full pl-10 pr-3 py-2 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
        placeholder="a234567@alumnos.uaslp.mx"
      />
    </div>
  </div>

  <!-- Password Inputs -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label for="password" class="block text-sm font-bold text-oxford-navy-700 mb-1">
        Contraseña
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <input
          id="password"
          type="password"
          required
          class="block w-full pl-10 pr-3 py-2 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
          placeholder="••••••••"
        />
      </div>
    </div>
    
    <div>
      <label for="confirm_password" class="block text-sm font-bold text-oxford-navy-700 mb-1">
        Confirmar
      </label>
      <div class="relative">
        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
          <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
             <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
        <input
          id="confirm_password"
          type="password"
          required
          class="block w-full pl-10 pr-3 py-2 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
          placeholder="••••••••"
        />
      </div>
    </div>
  </div>

  <!-- Submit Button -->
  <div class="pt-2">
    <app-button variant="primary" size="lg" type="submit" class="w-full">
      Crear cuenta
    </app-button>
  </div>
</form>

<!-- Divider -->
<div class="mt-6 relative">
  <div class="absolute inset-0 flex items-center">
    <div class="w-full border-t border-cerulean-200"></div>
  </div>
  <div class="relative flex justify-center text-sm">
    <span class="px-3 bg-white text-oxford-navy-400 font-medium">O registrarse con</span>
  </div>
</div>

<!-- Social Logins -->
<div class="mt-6 grid grid-cols-2 gap-4">
  <button class="w-full inline-flex justify-center items-center py-2 px-4 border-2 border-cerulean-100 rounded-xl shadow-sm bg-white text-sm font-bold text-oxford-navy-700 hover:bg-cerulean-50 transition-colors active:bg-cerulean-100">
    <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="h-5 w-5 mr-2" alt="Google logo">
    Google
  </button>

  <button class="w-full inline-flex justify-center items-center py-2 px-4 border-2 border-cerulean-100 rounded-xl shadow-sm bg-white text-sm font-bold text-oxford-navy-700 hover:bg-cerulean-50 transition-colors active:bg-cerulean-100">
    <img src="https://www.svgrepo.com/show/452281/microsoft.svg" class="h-5 w-5 mr-2" alt="Microsoft logo">
    Microsoft
  </button>
</div>

<!-- Login Prompt -->
<div class="mt-6 text-center text-sm">
  <span class="text-oxford-navy-600">¿Ya tienes cuenta?</span>
  <a routerLink="/auth/login" class="ml-1 font-bold text-punch-red-500 hover:text-punch-red-600 transition-colors">
    Inicia sesión
  </a>
</div>
