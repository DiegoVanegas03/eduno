<div class="text-center mb-8">
  <h2 class="text-2xl font-extrabold text-oxford-navy-900 tracking-tight mb-2">
    Inicia sesión en Eduno
  </h2>
  <p class="text-oxford-navy-500 text-sm">
    Tu puerta de entrada al éxito universitario
  </p>
</div>

<form class="space-y-6" (ngSubmit)="onSubmit()">
  <!-- Email Input -->
  <div>
    <label for="email" class="block text-sm font-bold text-oxford-navy-700 mb-1">
      Correo institucional o personal
    </label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" />
        </svg>
      </div>
      <input
        id="email"
        name="email"
        [(ngModel)]="email"
        type="email"
        required
        class="block w-full pl-10 pr-3 py-2.5 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
        placeholder="a234567@alumnos.uaslp.mx"
      />
    </div>
  </div>

  <!-- Password Input -->
  <div>
    <label for="password" class="block text-sm font-bold text-oxford-navy-700 mb-1">
      Contraseña
    </label>
    <div class="relative">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-5 w-5 text-oxford-navy-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <input
        id="password"
        name="password"
        [(ngModel)]="password"
        type="password"
        required
        class="block w-full pl-10 pr-3 py-2.5 border border-cerulean-200 rounded-xl leading-5 bg-cerulean-50/50 text-oxford-navy-900 placeholder-oxford-navy-400 focus:outline-none focus:ring-2 focus:ring-punch-red-400 focus:border-punch-red-400 transition-all sm:text-sm shadow-sm"
        placeholder="••••••••"
      />
    </div>
    <div class="flex justify-end mt-2">
      <a href="#" class="text-sm font-medium text-punch-red-500 hover:text-punch-red-600 transition-colors">
        ¿Olvidaste tu contraseña?
      </a>
    </div>
  </div>

  <!-- Submit Button -->
  <div>
    @if (errorMessage()) {
      <div class="mb-4 text-sm font-medium text-punch-red-600 bg-punch-red-50 p-3 rounded-lg border border-punch-red-100 flex items-center">
        <svg class="h-5 w-5 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        {{ errorMessage() }}
      </div>
    }
    <app-button variant="primary" size="lg" type="submit" class="w-full" [disabled]="isLoading()">
      {{ isLoading() ? 'Verificando...' : 'Iniciar sesión' }}
      <ng-container icon-right>
        <svg class="w-5 h-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
        </svg>
      </ng-container>
    </app-button>
  </div>
</form>

<!-- Divider -->
<div class="mt-8 relative">
  <div class="absolute inset-0 flex items-center">
    <div class="w-full border-t border-cerulean-200"></div>
  </div>
  <div class="relative flex justify-center text-sm">
    <span class="px-3 bg-white text-oxford-navy-400 font-medium">O continuar con</span>
  </div>
</div>

<!-- Social Logins -->
<div class="mt-8 grid grid-cols-2 gap-4">
  <button class="w-full inline-flex justify-center items-center py-2.5 px-4 border-2 border-cerulean-100 rounded-xl shadow-sm bg-white text-sm font-bold text-oxford-navy-700 hover:bg-cerulean-50 transition-colors active:bg-cerulean-100">
    <img src="assets/svgs/google.svg" class="h-5 w-5 mr-2" alt="Google logo">
    Google
  </button>

  <button class="w-full inline-flex justify-center items-center py-2.5 px-4 border-2 border-cerulean-100 rounded-xl shadow-sm bg-white text-sm font-bold text-oxford-navy-700 hover:bg-cerulean-50 transition-colors active:bg-cerulean-100">
    <img src="assets/svgs/microsoft.svg" class="h-5 w-5 mr-2" alt="Microsoft logo">
    Microsoft
  </button>
</div>

<!-- Sign Up Prompt -->
<div class="mt-8 text-center text-sm">
  <span class="text-oxford-navy-600">¿No tienes cuenta?</span>
  <a routerLink="/auth/register" class="ml-1 font-bold text-punch-red-500 hover:text-punch-red-600 transition-colors">
    Regístrate gratis
  </a>
</div>
