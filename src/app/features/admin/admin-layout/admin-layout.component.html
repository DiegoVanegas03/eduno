<div class="flex h-screen bg-cerulean-50 font-sans overflow-hidden">
  
  <!-- Sidebar -->
  <aside 
    class="bg-white flex flex-col shadow-xl transition-all duration-300 z-20"
    [class.w-64]="!isSidebarCollapsed()"
    [class.w-20]="isSidebarCollapsed()"
  >
    <!-- Sidebar Header -->
    <div class="h-20 flex items-center px-4 border-b border-gray-100 justify-between">
      <div class="flex items-center gap-3 overflow-hidden" *ngIf="!isSidebarCollapsed()">
        <app-logo></app-logo>
      </div>
      <div class="flex items-center justify-center w-full" *ngIf="isSidebarCollapsed()">
        <div class="w-8 h-8 bg-cerulean-600 rounded-lg flex items-center justify-center text-white font-bold">E</div>
      </div>
      <button 
        (click)="toggleSidebar()" 
        class="text-gray-400 hover:text-cerulean-600 transition-colors p-1"
        [class.absolute]="isSidebarCollapsed()"
        [class.right-[-12px]]="isSidebarCollapsed()"
        [class.bg-white]="isSidebarCollapsed()"
        [class.rounded-full]="isSidebarCollapsed()"
        [class.shadow]="isSidebarCollapsed()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition-transform" [class.rotate-180]="isSidebarCollapsed()" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
        </svg>
      </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto custom-scrollbar">
      <a 
        routerLink="dashboard" 
        routerLinkActive="bg-cerulean-50 text-cerulean-700 font-semibold" 
        class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group"
        [title]="isSidebarCollapsed() ? 'Dashboard' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 transition-colors group-hover:text-cerulean-600" [class.text-cerulean-600]="false" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
        <span class="whitespace-nowrap transition-opacity duration-300" [class.opacity-0]="isSidebarCollapsed()" [class.w-0]="isSidebarCollapsed()">Dashboard</span>
      </a>



      <a 
        routerLink="manage-users" 
        routerLinkActive="bg-cerulean-50 text-cerulean-700 font-semibold" 
        class="flex items-center gap-3 px-3 py-3 rounded-xl text-gray-500 hover:bg-gray-50 hover:text-gray-900 transition-all group"
        [title]="isSidebarCollapsed() ? 'Usuarios' : ''"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0 transition-colors group-hover:text-cerulean-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        <span class="whitespace-nowrap transition-opacity duration-300" [class.opacity-0]="isSidebarCollapsed()" [class.w-0]="isSidebarCollapsed()">Usuarios</span>
      </a>
    </nav>
    
    <!-- Sidebar Footer with User Card -->
    <div class="p-3 border-t border-gray-100 min-h-20 flex items-center justify-center">
      <div [class.hidden]="isSidebarCollapsed()" class="w-full">
        <app-user-card></app-user-card>
      </div>
      <div *ngIf="isSidebarCollapsed()">
         <!-- Minimal user representation when collapsed -->
         <div class="w-10 h-10 bg-cerulean-100 rounded-full flex items-center justify-center text-cerulean-700 font-bold shadow-sm cursor-pointer hover:ring-2 ring-cerulean-400 transition-all">
            U
         </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
    <!-- Top Header -->
    <header class="h-20 bg-white/80 backdrop-blur-md shadow-sm flex items-center justify-between px-8 z-10 sticky top-0">
      <div>
        <h2 class="text-xl font-bold text-oxford-navy-800">Administración general</h2>
        <p class="text-sm text-gray-500">Gestiona los recursos de la plataforma</p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Notification Bell -->
        <button class="relative p-2 text-gray-400 hover:text-cerulean-600 transition-colors bg-gray-50 hover:bg-cerulean-50 rounded-full">
          <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-punch-red-500 rounded-full border-2 border-white"></span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Content Area -->
    <div class="flex-1 overflow-auto p-4 md:p-8">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
