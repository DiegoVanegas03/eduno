# ============================================================
# Root docker-compose.yml para el monorepo Eduno
# Orquesta todos los servicios de infraestructura
# ============================================================
# NOTA: El servidor Node (backend) corre LOCAL con `pnpm backend`
# Solo MinIO y ClamAV viven en Docker
# ============================================================

services:

  # ─── Base de Datos MongoDB (single-node replica set) ────────
  mongodb:
    image: mongo:latest
    container_name: eduno_mongodb
    ports:
      - "27017:27017"
    # --replSet habilita el modo replica set; sin esto no hay transacciones
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - eduno_network
    healthcheck:
      test: |
        mongosh --quiet --eval "
          try { rs.status().ok } catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}) }
        "
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ─── Almacenamiento de objetos (S3-compatible) ──────────────
  minio:
    image: minio/minio:latest
    container_name: eduno_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola Web: http://localhost:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=DQ*ak!wf&RI9Pk1Kb@4h
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - eduno_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Script de inicialización de MinIO (bucket "documentos") ─
  minio_setup:
    image: minio/mc:latest
    container_name: eduno_minio_setup
    profiles: ["setup"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin $${MINIO_ROOT_PASSWORD:-DQ*ak!wf&RI9Pk1Kb@4h};
      mc mb --ignore-existing local/documentos;
      mc anonymous set public local/documentos;
      mc mb --ignore-existing local/perfiles;
      mc anonymous set public local/perfiles;
      mc mb --ignore-existing local/archivos;
      mc anonymous set public local/archivos;
      echo '✅ Buckets documentos, perfiles y archivos listos';
      exit 0;
      "
    networks:
      - eduno_network

  # ─── Antivirus ClamAV ────────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    container_name: eduno_clamav
    platform: linux/amd64
    ports:
      - "3310:3310"
    networks:
      - eduno_network

volumes:
  mongo_data:
  minio_data:

networks:
  eduno_network:
    driver: bridge
