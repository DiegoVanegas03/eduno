# ============================================================
# Root docker-compose.yml para el monorepo Eduno
# Orquesta todos los servicios de infraestructura
# ============================================================
# NOTA: El servidor Node (backend) corre LOCAL con `pnpm backend`
# Solo MinIO y ClamAV viven en Docker
# ============================================================

services:

  # ─── Almacenamiento de objetos (S3-compatible) ──────────────
  minio:
    image: minio/minio:latest
    container_name: eduno_minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Consola Web: http://localhost:9001
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - eduno_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Script de inicialización de MinIO (bucket "documentos") ─
  minio_setup:
    image: minio/mc:latest
    container_name: eduno_minio_setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123;
      mc mb --ignore-existing local/documentos;
      mc anonymous set public local/documentos;
      echo '✅ Bucket documentos listo';
      exit 0;
      "
    networks:
      - eduno_network

  # ─── Antivirus ClamAV ────────────────────────────────────────
  clamav:
    image: clamav/clamav:latest
    container_name: eduno_clamav
    platform: linux/amd64
    ports:
      - "3310:3310"
    networks:
      - eduno_network

volumes:
  minio_data:

networks:
  eduno_network:
    driver: bridge
